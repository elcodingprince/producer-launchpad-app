# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3da5986e71a33bebe7686dc13c5bb80e"
name = "Producer Launchpad Staging"
application_url = "https://producer-launchpad-staging.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "pl-staging.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders-create"

[access_scopes]
scopes = "read_products,write_products,read_publications,write_publications,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_orders,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://producer-launchpad-staging.fly.dev/auth/callback" ]

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "producer-launchpad"
